name: Reopen issue when moved out of Done on Org Kanban

on:
  schedule:
    # Every 15 minutes. projects_v2_item is not a valid repo-level Actions
    # trigger — Projects v2 field changes are org-level events only, and
    # this workflow's original event-based trigger never fired a single
    # run in this repo's history. Reconciling on a schedule instead.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (log without reopening)'
        required: false
        default: 'true'
        type: boolean

env:
  GH_TOKEN: ${{ secrets.ACTIONS_TOKEN }}
  ORG_KANBAN_PROJECT_ID: PVT_kwDOAA7NZM4AqQF8
  TODO_OPTION_ID: f75ad846
  IN_PROGRESS_OPTION_ID: "47fc9ee4"

jobs:
  kanban-status-reopen:
    runs-on: ubuntu-latest

    steps:
      - name: Reopen issues whose item is To Do/In Progress but issue is closed
        run: |
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          echo "Dry run: $DRY_RUN"
          echo "---"

          REOPENED=0
          CURSOR=""

          while true; do
            if [ -n "$CURSOR" ]; then
              RESULT=$(gh api graphql -f query='
                query($project: ID!, $cursor: String!) {
                  node(id: $project) {
                    ... on ProjectV2 {
                      items(first: 100, after: $cursor) {
                        nodes {
                          fieldValueByName(name: "Status") {
                            ... on ProjectV2ItemFieldSingleSelectValue { optionId }
                          }
                          content {
                            ... on Issue {
                              number
                              state
                              repository { nameWithOwner }
                            }
                          }
                        }
                        pageInfo { hasNextPage endCursor }
                      }
                    }
                  }
                }' -f project="$ORG_KANBAN_PROJECT_ID" -f cursor="$CURSOR")
            else
              RESULT=$(gh api graphql -f query='
                query($project: ID!) {
                  node(id: $project) {
                    ... on ProjectV2 {
                      items(first: 100) {
                        nodes {
                          fieldValueByName(name: "Status") {
                            ... on ProjectV2ItemFieldSingleSelectValue { optionId }
                          }
                          content {
                            ... on Issue {
                              number
                              state
                              repository { nameWithOwner }
                            }
                          }
                        }
                        pageInfo { hasNextPage endCursor }
                      }
                    }
                  }
                }' -f project="$ORG_KANBAN_PROJECT_ID")
            fi

            HAS_NEXT=$(echo "$RESULT" | jq -r '.data.node.items.pageInfo.hasNextPage')
            CURSOR=$(echo "$RESULT" | jq -r '.data.node.items.pageInfo.endCursor')

            while IFS= read -r item; do
              OPTION_ID=$(echo "$item" | jq -r '.fieldValueByName.optionId // ""')
              ISSUE_NUMBER=$(echo "$item" | jq -r '.content.number // ""')
              ISSUE_STATE=$(echo "$item" | jq -r '.content.state // ""')
              REPO=$(echo "$item" | jq -r '.content.repository.nameWithOwner // ""')

              if [ "$OPTION_ID" != "$TODO_OPTION_ID" ] && [ "$OPTION_ID" != "$IN_PROGRESS_OPTION_ID" ]; then
                continue
              fi

              if [ -z "$ISSUE_NUMBER" ] || [ -z "$REPO" ]; then
                continue
              fi

              if [ "$ISSUE_STATE" != "CLOSED" ]; then
                continue
              fi

              echo "Would reopen: #$ISSUE_NUMBER in $REPO (item is To Do/In Progress but issue is closed)"

              if [ "$DRY_RUN" != "true" ]; then
                gh issue reopen "$ISSUE_NUMBER" --repo "$REPO"
                echo "  → Reopened."
                REOPENED=$((REOPENED + 1))
              fi
            done < <(echo "$RESULT" | jq -c '.data.node.items.nodes[]')

            [ "$HAS_NEXT" != "true" ] && break
          done

          echo "---"
          if [ "$DRY_RUN" == "true" ]; then
            echo "Dry run complete. Run with dry_run=false to apply."
          else
            echo "Reopened $REOPENED issue(s)."
          fi
